<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#050505">

<title>Traffic Chaos</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* GAME */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:600px;
  overflow:hidden;
  background:#111;
}

/* ROAD */

#road{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #222 0%,
      #333 8%,
      #333 92%,
      #222 100%
    );
}

.road-line{
  position:absolute;
  top:-120px;
  width:7px;
  height:90px;
  background:#eee;
  border-radius:5px;
  opacity:.85;
}

#line1{
  left:33.33%;
}

#line2{
  left:66.66%;
}

/* ROAD EDGES */

.edge{
  position:absolute;
  top:0;
  width:7px;
  height:100%;
  background:#f5d742;
}

#edgeLeft{
  left:8%;
}

#edgeRight{
  right:8%;
}

/* HUD */

#hud{
  position:absolute;
  top:18px;
  left:0;
  right:0;
  z-index:20;

  display:flex;
  justify-content:space-around;
  color:white;
  text-shadow:0 3px 8px #000;
}

.hudBox{
  text-align:center;
}

.hudLabel{
  font-size:12px;
  opacity:.7;
  letter-spacing:2px;
}

.hudValue{
  font-size:25px;
  font-weight:bold;
}

/* PLAYER */

#player{
  position:absolute;
  width:55px;
  height:100px;
  bottom:125px;
  left:calc(50% - 27.5px);
  z-index:10;

  border-radius:14px 14px 9px 9px;

  background:
    linear-gradient(
      90deg,
      #7b0000,
      #ff3030,
      #9b0000
    );

  box-shadow:
    0 8px 20px rgba(0,0,0,.7),
    inset 0 0 10px rgba(255,255,255,.25);
}

/* CAR WINDOWS */

#player::before{
  content:"";
  position:absolute;
  top:13px;
  left:9px;
  width:37px;
  height:27px;
  border-radius:7px;

  background:
    linear-gradient(
      135deg,
      #d9f5ff,
      #23526b
    );
}

/* CAR LIGHTS */

#player::after{
  content:"";
  position:absolute;
  bottom:9px;
  left:8px;
  width:39px;
  height:8px;

  border-radius:5px;

  background:
    linear-gradient(
      90deg,
      #ff3333 0 40%,
      transparent 40% 60%,
      #ff3333 60%
    );
}

/* CONTROLS */

#controls{
  position:absolute;
  bottom:45px;
  left:0;
  right:0;
  z-index:30;

  display:flex;
  justify-content:center;
  gap:55px;
}

.control{
  width:110px;
  height:75px;

  border:2px solid rgba(255,255,255,.3);
  border-radius:20px;

  background:rgba(0,0,0,.65);
  color:white;

  font-size:38px;
  font-weight:bold;

  box-shadow:0 8px 20px rgba(0,0,0,.55);

 touch-action: manipulation;
      transition:
      transform  .08s ease,
      background .08s ease;
      }
.control:active{
  transform:scale(.90);
  background:rgba(255,255,255,.20);
      box-shadow:0 3px 10px rgba(0,0,0,.6);
      
}

/* START SCREEN */

#startScreen{
  position:absolute;
  inset:0;
  z-index:100;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  color:white;

  background:
    radial-gradient(
      circle at center,
      #293044,
      #050505 70%
    );
}

#title{
  font-size:46px;
  font-weight:900;
  letter-spacing:2px;

  text-align:center;

  text-shadow:
    0 5px 0 #9b0000,
    0 10px 25px #000;
}

#subtitle{
  margin-top:10px;
  color:#ddd;
  font-size:15px;
  letter-spacing:3px;
}

#startButton{
  margin-top:40px;

  padding:17px 45px;

  border:0;
  border-radius:15px;

  background:#ff3030;
  color:white;

  font-size:20px;
  font-weight:bold;

  box-shadow:
    0 7px 0 #970000,
    0 12px 30px #000;
}

#startButton:active{
  transform:translateY(5px);
  box-shadow:
    0 2px 0 #970000;
}

/* MUSIC BUTTON */

#musicButton{
  position:absolute;
  top:18px;
  right:15px;
  z-index:110;

  width:43px;
  height:43px;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.55);
  color:white;

  font-size:20px;
}

/* HIDE */

.hidden{
  display:none !important;
}

</style>
</head>

<body>

<div id="game">

  <div id="road">

    <div class="edge" id="edgeLeft"></div>
    <div class="edge" id="edgeRight"></div>

    <div class="road-line" id="line1"></div>
    <div class="road-line" id="line2"></div>

  </div>

  <div id="hud">

    <div class="hudBox">
      <div class="hudLabel">SCORE</div>
      <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox">
      <div class="hudLabel">BEST</div>
      <div class="hudValue" id="best">0</div>
    </div>

  </div>

  <button id="musicButton">🔊</button>

  <div id="player"></div>

  <div id="controls">

    <button class="control" id="leftButton">⬅</button>

    <button class="control" id="rightButton">➡</button>

  </div>

  <div id="startScreen">

    <div id="title">
      TRAFFIC<br>CHAOS
    </div>

    <div id="subtitle">
      DODGE • SURVIVE • GO FASTER
    </div>

    <button id="startButton">
      START GAME
    </button>

  </div>

</div>

<script>


const player = document.getElementById("player");
const game = document.getElementById("game");
const road = document.getElementById("road");
const startButton = document.getElementById("startButton");
const startScreen = document.getElementById("startScreen");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const musicButton = document.getElementById("musicButton");
const leftButton = document.getElementById("leftButton");
const rightButton = document.getElementById("rightButton");

let score = 0;
let best = Number(localStorage.getItem("traffic-chaos-best")) || 0;
let gameRunning = false;
let playerLane = 1;
let speed = 300;
let lastTime = 0;
let spawnTimer = 0;
let roadOffset = 0;
let traffic = [];
let roadLines = [];
let animationId = null;
let musicOn = true;
let audio = null;
let musicTimer = null;

bestText.textContent = best;

// Create animated road markings
document.getElementById("line1").remove();
document.getElementById("line2").remove();

for (let i = 0; i < 2; i++) {
  for (let j = 0; j < 7; j++) {
    const line = document.createElement("div");
    line.className = "road-line";
    line.style.left = i === 0 ? "33.33%" : "66.66%";
    line.style.top = (j * 140 - 120) + "px";
    road.appendChild(line);
    roadLines.push(line);
  }
}

// Player movement
function updatePlayer() {
  const positions = [21, 50, 79];
  player.style.left =
    `calc(${positions[playerLane]}% - 27.5px)`;
}

function moveLeft() {
  if (gameRunning && playerLane > 0) {
    playerLane--;
    updatePlayer();
  }
}

function moveRight() {
  if (gameRunning && playerLane < 2) {
    playerLane++;
    updatePlayer();
  }
}

leftButton.addEventListener("click", moveLeft);
rightButton.addEventListener("click", moveRight);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
  if (e.key === "ArrowRight" || e.key === "d") moveRight();
});
      
   
// Spawn incoming traffic and barriers
function spawnTraffic() {
  const lane = Math.floor(Math.random() * 3);
  const isBarrier = Math.random() < 0.25;

  const obstacle = document.createElement("div");
  obstacle.className = isBarrier
    ? "traffic-barrier"
    : "traffic-car";

  const colors = [
    "#168cff", "#ffd12e", "#a855f7",
    "#16c784", "#f97316"
  ];
  const color = colors[
    Math.floor(Math.random() * colors.length)
  ];

  obstacle.style.cssText = `
    position:absolute;
    width:${isBarrier ? 58 : 52}px;
    height:${isBarrier ? 45 : 88}px;
    top:-110px;
    left:calc(${[21, 50, 79][lane]}% - ${isBarrier ? 29 : 26}px);
    z-index:8;
    border-radius:${isBarrier ? "8px" : "12px"};
    background:${isBarrier
      ? "repeating-linear-gradient(135deg,#ffdf35 0 12px,#222 12px 24px)"
      : `linear-gradient(90deg,#222,${color},#222)`};
    border:${isBarrier ? "3px solid #fff" : "2px solid #ddd"};
    box-shadow:0 6px 15px #0009;
  `;

  if (!isBarrier) {
    const window = document.createElement("div");
    window.style.cssText = `
      position:absolute;
      top:12px;
      left:8px;
      width:32px;
      height:24px;
      border-radius:5px;
      background:linear-gradient(135deg,#d7f5ff,#31536b);
    `;
    obstacle.appendChild(window);
  }

  game.appendChild(obstacle);
  traffic.push({
    element: obstacle,
    lane,
    y: -110
  });
}

// Check collision with player
function checkCollision(obstacle) {
  if (obstacle.lane !== playerLane) return false;

  const p = player.getBoundingClientRect();
  const o = obstacle.element.getBoundingClientRect();

  return (
    p.left + 9 < o.right - 7 &&
    p.right - 9 > o.left + 7 &&
    p.top + 12 < o.bottom - 5 &&
    p.bottom - 8 > o.top + 5
  );
}

// Game over
function crash() {
  gameRunning = false;
  cancelAnimationFrame(animationId);
  stopMusic();

  if (Math.floor(score) > best) {
    best = Math.floor(score);
    localStorage.setItem("traffic-chaos-best", best);
    bestText.textContent = best;
  }

  const gameOver = document.createElement("div");
  gameOver.id = "gameOver";
  gameOver.style.cssText = `
    position:absolute;
    inset:0;
    z-index:150;
    background:#000c;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
  `;

  gameOver.innerHTML = `
    <div style="font-size:58px">💥</div>
    <h1 style="font-size:38px;margin:12px">CRASH!</h1>
    <p style="font-size:20px">Score: ${Math.floor(score)}</p>
    <p style="font-size:16px;margin:8px">Best: ${best}</p>
    <button id="retryButton" style="
      margin-top:25px;
      padding:16px 35px;
      border:0;
      border-radius:14px;
      background:#ff3030;
      color:white;
      font-size:20px;
      font-weight:bold">
      TRY AGAIN
    </button>
  `;

  game.appendChild(gameOver);

  document.getElementById("retryButton")
    .addEventListener("click", () => {
      gameOver.remove();
      startGame();
    });

  game.animate(
    [
      { transform: "translateX(-8px)" },
      { transform: "translateX(8px)" },
      { transform: "translateX(-5px)" },
      { transform: "translateX(0)" }
    ],
    { duration: 250 }
  );
}
    
// Main game loop
function gameLoop(time) {
  if (!gameRunning) return;

  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  // Increase speed as score rises
  speed = 300 + Math.min(score * 2, 450);

  // Animate road lines
  roadOffset += speed * dt;

  roadLines.forEach((line, i) => {
    const y = (i % 7) * 140 - 120 + roadOffset % 140;
    line.style.top = y + "px";
  });

  // Spawn traffic
  spawnTimer += dt;
  const spawnDelay = Math.max(0.48, 1.05 - score * 0.003);

  if (spawnTimer >= spawnDelay) {
    spawnTimer = 0;
    spawnTraffic();
  }

  // Move obstacles
  for (let i = traffic.length - 1; i >= 0; i--) {
    const obstacle = traffic[i];
    obstacle.y += speed * dt;
    obstacle.element.style.top = obstacle.y + "px";

    if (checkCollision(obstacle)) {
      crash();
      return;
    }

    if (obstacle.y > game.clientHeight + 120) {
      obstacle.element.remove();
      traffic.splice(i, 1);
    }
  }

  // Survival score
  score += dt * 10;
  scoreText.textContent = Math.floor(score);

  animationId = requestAnimationFrame(gameLoop);
}

// Start and restart game
function startGame() {
  if (animationId) cancelAnimationFrame(animationId);

  traffic.forEach(item => item.element.remove());
  traffic = [];

  score = 0;
  speed = 300;
  spawnTimer = 0;
  roadOffset = 0;
  playerLane = 1;

  updatePlayer();
  scoreText.textContent = "0";
  startScreen.classList.add("hidden");

  const oldGameOver = document.getElementById("gameOver");
  if (oldGameOver) oldGameOver.remove();

  gameRunning = true;
  lastTime = performance.now();

  startMusic();
  animationId = requestAnimationFrame(gameLoop);
}

startButton.addEventListener("click", startGame);

// Simple synthesized arcade music
function startMusic() {
  if (!musicOn || musicTimer) return;

  try {
    audio = audio ||
      new (window.AudioContext || window.webkitAudioContext)();

    audio.resume();

    const notes = [220, 277, 330, 440, 330, 277, 196, 247];
    let beat = 0;

    musicTimer = setInterval(() => {
      if (!gameRunning || !musicOn || !audio) return;

      const osc = audio.createOscillator();
      const gain = audio.createGain();

      osc.type = beat % 2 ? "square" : "triangle";
      osc.frequency.value = notes[beat % notes.length];

      gain.gain.setValueAtTime(0.045, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + 0.16
      );

      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + 0.17);

      beat++;
    }, 190);
  } catch (error) {
    console.log("Audio unavailable", error);
  }
}

function stopMusic() {
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = null;
}

// Music on/off
musicButton.addEventListener("click", () => {
  musicOn = !musicOn;
  musicButton.textContent = musicOn ? "🔊" : "🔇";

  if (musicOn && gameRunning) {
    startMusic();
  } else {
    stopMusic();
  }
});
          
</script>

</body>
</html>
